name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint
      continue-on-error: true # Next.js default lint script sometimes fails on missing configs, better to not block initially

    - name: Build Next.js App
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: https://judgement-game-30op.onrender.com/api/v1
        NEXT_PUBLIC_WS_URL: wss://judgement-game-30op.onrender.com/api/v1/lobbies
