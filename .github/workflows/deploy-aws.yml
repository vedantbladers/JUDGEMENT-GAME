name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test, Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Unit Tests
        run: |
          cd backend
          go mod download
          go test -v ./...

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: judgement-backend
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy Container to EC2 via SSH
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials for Deployment Step
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: SSH to EC2 and Update Container
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/judgement-backend:latest
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: ECR_IMAGE
          script: |
            # 1. Log in Docker to AWS ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # 2. Pull the latest image
            docker pull $ECR_IMAGE

            # 3. Stop and remove the existing container (if running)
            docker stop judgement-backend || true
            docker rm judgement-backend || true

            # 4. Run the updated container bound to 127.0.0.1:8080
            docker run -d \
              --name judgement-backend \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -e PORT=8080 \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              $ECR_IMAGE

            # 5. Clean up dangling images to save disk space
            docker image prune -af --filter "until=48h"
